global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Recording rules: pre-compute expensive PromQL into cheap derived series.
# Every dashboard panel and alert references these instead of re-evaluating
# the raw histogram_quantile() fan-out on every query.
# See: https://prometheus.io/docs/practices/rules/
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'flask_app'
    scrape_interval: 5s
    static_configs:
      - targets: [ 'flask-app:8000' ]
